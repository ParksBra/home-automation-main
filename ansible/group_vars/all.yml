debug: "{{ lookup('env', 'DEBUG') | default(false) | bool }}"

ansible_user: "ansible"
ansible_group: "ansible"

patching_enabled: true
patching_script_path: "/root/patching.sh"
patching_cron:
  - "15" # Minute
  - "2" # Hour
  - "*" # Day of month
  - "*" # Month
  - "1" # Day of week (0-7) (Sunday is both 0 and 7)

service_user: "docker"
service_group: "docker"
service_uid: 1001
service_gid: 1001

timezone: "America/Los_Angeles"

home_path: "/home/{{ service_user }}"
ansible_home_path: "/home/{{ ansible_user }}"

docker_compose_path: "{{ ansible_home_path }}/docker"
docker_compose_force_recreate: "{{ lookup('env', 'DOCKER_FORCE_CONTAINER_RECREATION') | default(false) | bool }}"

enable_autoheal: true

swag_internal_cidr: "{{ lookup('env', 'SWAG_INTERNAL_CIDR') | default('192.168.0.0/16') }}"
swag_domain: "{{ lookup('env', 'EXTERNAL_DOMAIN') | default('localhost') }}"
swag_config_path: "{{ home_path }}/swag/data"
swag_validation_method: "dns"
swag_cloudflare_api_token: "{{ lookup('env', 'SWAG_CLOUDFLARE_API_TOKEN') | default('token') }}"
swag_letsencrypt_email: "{{ lookup('env', 'SWAG_LETSENCRYPT_EMAIL') | default('') }}"
swag_domains:
  - "{{ homeassistant_subdomain }}.{{ swag_domain }}"
  - "{{ zigbee2mqtt_subdomain }}.{{ swag_domain }}"

swag_homeassistant_external_port: 443
swag_homeassistant_internal_port: 8123

homeassistant_mount_path: "{{ home_path }}/homeassistant/data"
homeassistant_backup_disk_path: "{{ homeassistant_mount_path }}/backups"
homeassistant_subdomain: "ha"
homeassistant_log_level: "info"
homeassistant_enabled_configurations:
  - "automation"
  - "script"
  - "scene"
  - "group"
  - "command_line"
homeassistant_enable_ip_ban: true
homeassistant_ip_ban_threshold: 10
homeassistant_trusted_proxies:
  - "{{ swag_internal_cidr }}" # Local Lan
  - "172.0.0.0/8"  # Docker network
  - "172.0.0.1/32" # Docker host localhost
homeassistant_enable_mobile_app: true
homeassistant_enable_my: true
homeassistant_enable_python_script: true

zigbee2mqtt_mount_path: "{{ home_path }}/zigbee2mqtt/data"
zigbee2mqtt_backup_disk_path: "{{ zigbee2mqtt_mount_path }}/backups"
zigbee2mqtt_base_topic: "zigbee2mqtt"
zigbee2mqtt_serial_port: "/dev/ttyACM0"
zigbee2mqtt_serial_adapter: "ember"
zigbee2mqtt_serial_baudrate: 460800
zigbee2mqtt_serial_rtscts: true
zigbee2mqtt_frontend_enabled: true
zigbee2mqtt_frontend_port: 8234
zigbee2mqtt_subdomain: "z2m.{{ homeassistant_subdomain }}"

govee2mqtt_mount_path: "{{ home_path }}/govee2mqtt/data"
govee2mqtt_temperature_scale: "F"

mqtt_mount_path: "{{ home_path }}/mqtt5"
mqtt_version: "5"

nut_upsmon_maxretry: 5
nut_upsmon_device_name: "cyberpower"
nut_upsmon_device_driver: "usbhid-ups"
nut_upsmon_device_port: "auto"
nut_upsmon_device_desc: "CyberPower ST625U"
nut_upsmon_battery_charge_low: 15
nut_users_upsmon_password: "{{ lookup('env', 'NUT_UPSD_UPSMON_USER_PASSWORD') | default('upsmon') }}"
nut_users_upsadmin_password: "{{ lookup('env', 'NUT_UPSD_UPSADMIN_USER_PASSWORD') | default('admin') }}"
nut_upsd_port: 3493
