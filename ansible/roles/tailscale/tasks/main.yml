- name: Install tailscale
  ansible.builtin.block:
    - name: Download signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release | lower }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
        owner: root
        group: root
        mode: '0644'

    - name: Add tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release | lower }} main"
        filename: tailscale
        state: present
        update_cache: true

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Configure tailscale
  ansible.builtin.shell:
    cmd: |
      tailscale up --authkey={{ tailscale_auth_key }} --advertise-tags="{{ tailscale_advertise_tags | join(',') }}"
    creates: /var/lib/tailscale/tailscaled.state
  become: true
  become_user: root

- name: Enable tailscale service
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Get tailscale IP address
  ansible.builtin.shell: tailscale ip -4
  register: tailscale_address
  cacheable: true
  changed_when: false
