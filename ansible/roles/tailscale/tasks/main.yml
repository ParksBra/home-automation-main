- name: Install tailscale
  block:
    - name: Download signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release | lower }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: '0644'

    - name: Add tailscale repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release | lower }} main"
        filename: tailscale
        state: present
        update_cache: true

    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: Check tailscale status
  ansible.builtin.shell: tailscale status
  register: tailscale_status
  failed_when: false
  changed_when: false
  no_log: "{{ not debug }}"

- name: Configure tailscale
  ansible.builtin.shell: tailscale up --authkey={{ tailscale_auth_key }} --advertise-tags="{{ tailscale_advertise_tags | join(',') }}"
  when: tailscale_status.rc != 0
  changed_when: true
  no_log: "{{ not debug }}"

- name: Enable tailscale service
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Get tailscale IP address
  ansible.builtin.shell: tailscale ip -4
  register: tailscale_address_temp
  changed_when: false

- name: Set tailscale address fact
  ansible.builtin.set_fact:
    tailscale_address: "{{ tailscale_address_temp.stdout }}"
    cacheable: true
