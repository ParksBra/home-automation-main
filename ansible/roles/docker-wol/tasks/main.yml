- name: Create the named pipe for wol
  ansible.builtin.command:
    cmd: "mkfifo {{ homeassistant_mount_path }}/wolpipe"
    creates: "{{ homeassistant_mount_path }}/wolpipe"
  become: true
  become_user: root

- name: Ensure the pipe has the correct permissions
  ansible.builtin.file:
    path: "{{ homeassistant_mount_path }}/wolpipe"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '0644'
  become: true
  become_user: root

- name: Create systemd service for wol
  ansible.builtin.template:
    src: "docker-wol.service.j2"
    dest: "/etc/systemd/system/docker-wol.service"
    owner: root
    group: root
    mode: '0644'
  become: true
  become_user: root

- name: Enable and start the wol service
  ansible.builtin.systemd_service:
    name: docker-wol.service
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: root
