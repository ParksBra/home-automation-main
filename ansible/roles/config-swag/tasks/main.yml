- name: Ensure path exists
  ansible.builtin.file:
    name: "{{ item }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    recurse: true
  with_items:
    - "{{ swag_mount_path }}/nginx/proxy-confs"
    - "{{ swag_mount_path }}/dns-conf"
    - "{{ swag_mount_path }}/etc/letsencrypt"
  changed_when: false

- name: Ensure backup path exists
  ansible.builtin.file:
    dest: "{{ swag_backup_disk_path }}"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    recurse: true
  changed_when: false

- name: Configure SWAG Cloudflare DNS plugin
  ansible.builtin.template:
    src: "dns-conf/cloudflare.ini.j2"
    dest: "{{ swag_mount_path }}/dns-conf/cloudflare.ini"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '660'
    backup: true
  notify: restart_swag
  no_log: "{{ not debug }}"

- name: Configure SWAG subdomains
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ swag_mount_path }}/nginx/proxy-confs/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '660'
    backup: true
  with_fileglob:
    - "{{ role_path }}/templates/nginx/proxy-confs/*.j2*"
  notify: restart_swag

- name: Configure NGINX base configuration
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ swag_mount_path }}/nginx/{{ item | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ service_user }}"
    group: "{{ service_group }}"
    mode: '660'
    backup: true
  with_fileglob:
    - "{{ role_path }}/templates/nginx/*.j2*"
  notify: restart_swag

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
