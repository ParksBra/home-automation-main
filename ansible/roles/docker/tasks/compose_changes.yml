- name: Ensure docker compose directory exists
  ansible.builtin.file:
    path: "{{ docker_compose_path }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"

- name: Render docker compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_path }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_group }}"
    mode: '0644'

- name: Debug domains
  ansible.builtin.debug:
    msg: "Home Assistant domain: {{ homeassistant_subdomain }}.{{ swag_domain }}, Zigbee2MQTT domain: {{ zigbee2mqtt_subdomain }}.{{ swag_domain }}, SWAG domain: {{ swag_domain }}"

- name: Run general docker compose
  community.docker.docker_compose_v2:
    pull: always
    project_src: "{{ docker_compose_path }}"
    assume_yes: true
    state: present
    build: always
    recreate: "{{ 'always' if docker_compose_force_recreate else 'auto' }}"
    remove_orphans: true
